#:schema https://developers.openai.com/codex/config-schema.json

[features]
multi_agent_v2 = true
# Behavioral lifecycle Hooks are disabled by the low-intrusion control-plane
# policy. Native auto-compaction remains unchanged.
hooks = false

[agents]
max_threads = 40
max_depth = 2
interrupt_message = true

# Every registered entry below is callable directly by Root. Manager-oriented
# names describe domain semantics, not a caller gate; AGENTS.md owns dispatch.

[agents."HMASDCodeProjectManager"]
description = "Read-only Sol-high L1 Code Project Manager for one Root-scoped implementation assignment."
config_file = "./agents/hmasd-code-project-manager.toml"
nickname_candidates = ["Code Project Manager", "Technical Manager", "Implementation Coordinator"]

[agents."HMASDWorkflowRecoveryManager"]
description = "Terra-high L1 owner for one bounded workflow failure recovery with isolated worktree repair and focused validation."
config_file = "./agents/hmasd-workflow-recovery-manager.toml"
nickname_candidates = ["Workflow Recovery Manager", "Failure Recovery Lead", "Autonomous Workflow Repair"]

[agents."HMASDIndependentResearchExplorer"]
description = "Read-only Sol-max L1 Independent Research Explorer for one Root-scoped research assignment."
config_file = "./agents/hmasd-independent-research-explorer.toml"
nickname_candidates = ["Independent Research Explorer", "Research Manager", "Scientific Explorer"]

[agents."HMASDProjectScout"]
description = "Read-only Luna project scout for bounded repository exploration and factual confirmation."
config_file = "./agents/hmasd-project-scout.toml"
nickname_candidates = ["Project Scout", "Repository Scout", "Read-only Scout"]

[agents."HMASDResearchArtifactWriter"]
description = "Workspace-write research artifact writer callable by Root or the Independent Research Explorer."
config_file = "./agents/hmasd-research-artifact-writer.toml"
nickname_candidates = ["Research Artifact Writer", "Research Writer", "Artifact Maintainer"]

[agents."HMASDCodeScout"]
description = "Read-only HMASD code scout for bounded interface mapping and safe parallel-work discovery."
config_file = "./agents/hmasd-code-scout.toml"
nickname_candidates = ["HMASD Scout", "Interface Scout", "Dependency Scout"]

[agents."HMASDImplementer"]
description = "HMASD implementation worker for one frozen bounded work package."
config_file = "./agents/hmasd-implementer.toml"
nickname_candidates = ["HMASD Implementer", "Algorithm Implementer", "Runtime Implementer"]

[agents."HMASDCPMMechanical"]
description = "Silent Luna-low mechanical leaf callable by Root or Code Project Manager."
config_file = "./agents/hmasd-cpm-mechanical.toml"
nickname_candidates = ["CPM Mechanical", "Mechanical Operator", "CPM Task Child"]

[agents."HMASDExplorerMechanical"]
description = "Silent Luna-low evidence leaf callable by Root or Independent Research Explorer."
config_file = "./agents/hmasd-explorer-mechanical.toml"
nickname_candidates = ["Explorer Mechanical", "Evidence Organizer", "Mechanical Reader"]

[agents."HMASDRoutineImplementer"]
description = "Terra-high implementation worker for one frozen routine engineering package."
config_file = "./agents/hmasd-implementer-terra.toml"
nickname_candidates = ["Routine Implementer", "Maintenance Implementer", "Refactor Implementer"]

[agents."HMASDVerifier"]
description = "HMASD focused CUDA and runtime verifier for an integrated package."
config_file = "./agents/hmasd-verifier.toml"
nickname_candidates = ["HMASD Verifier", "CUDA Verifier", "Evidence Verifier"]

[agents."HMASDReviewer"]
description = "Read-only HMASD reviewer for an integrated implementation package."
config_file = "./agents/hmasd-reviewer.toml"
nickname_candidates = ["HMASD Reviewer", "Algorithm Reviewer", "Runtime Reviewer"]

[agents."HMASDCPMAgentifyTransport"]
description = "Silent CPM Agentify transport leaf callable by Root or Code Project Manager."
config_file = "./agents/hmasd-cpm-agentify-transport.toml"
nickname_candidates = ["CPM Agentify Transport", "Technical Review Transport"]

[agents."HMASDExplorerAgentifyTransport"]
description = "Silent Explorer Agentify transport leaf callable by Root or Independent Research Explorer."
config_file = "./agents/hmasd-explorer-agentify-transport.toml"
nickname_candidates = ["Explorer Agentify Transport", "Research Review Transport"]

[agents."HMASDExternalGeminiTransport"]
description = "Silent Luna-high External Gemini transport leaf callable by Root or Independent Research Explorer."
config_file = "./agents/hmasd-external-gemini-transport.toml"
nickname_candidates = ["External Gemini Transport", "Gemini Scientific Transport"]

[agents."HMASDLunaMedium"]
description = "Luna-medium bounded worker for one simple design, configuration, or mechanical task."
config_file = "./agents/hmasd-luna-medium.toml"
nickname_candidates = ["Luna Medium", "Routine Luna", "Bounded Task Worker"]

[agents."HMASDLunaXHigh"]
description = "Luna-xhigh bounded verifier for one ambiguous or anomalous simple task."
config_file = "./agents/hmasd-luna-xhigh.toml"
nickname_candidates = ["Luna XHigh", "Luna Boundary Verifier", "Luna Anomaly Verifier"]

[agents."HMASDLunaMax"]
description = "Luna-max bounded minimality reviewer for one simple design or configuration task."
config_file = "./agents/hmasd-luna-max.toml"
nickname_candidates = ["Luna Max", "Luna Minimality Reviewer", "Luna Edge-Case Analyst"]

[agents."HMASDExperimentOperator"]
description = "Silent mechanical operator callable by Root or Code Project Manager for one authorized HMASD train-evaluate-analyze run."
config_file = "./agents/hmasd-experiment-operator.toml"
nickname_candidates = ["HMASD Experiment Operator", "Run Operator", "Formal Run Operator"]

[agents."HMASDResearchScout"]
description = "Read-only Sol-high scout for one bounded source/evidence-fidelity scientific question or campaign source assignment."
config_file = "./agents/hmasd-research-scout.toml"
nickname_candidates = ["Research Scout", "Evidence Scout", "Counterexample Scout"]

[agents."HMASDResearchInnovator"]
description = "Read-only Sol-max innovator for one bounded mechanism, repair, discriminator, or campaign innovation assignment."
config_file = "./agents/hmasd-research-innovator.toml"
nickname_candidates = ["Research Innovator", "Mechanism Explorer", "Direction Builder"]

[agents."HMASDResearchCritic"]
description = "Read-only Sol-max critic for one bounded exact criticism or canonical campaign adversarial assessment."
config_file = "./agents/hmasd-research-critic.toml"
nickname_candidates = ["Research Critic", "Claim Critic", "Evidence Challenger"]

[agents."HMASDResearchPrinciplesAnalyst"]
description = "Read-only Sol-max analyst for one bounded constructive learning-dynamics/mechanism question or campaign principles analysis."
config_file = "./agents/hmasd-research-principles-analyst.toml"
nickname_candidates = ["Research Principles Analyst", "RL Principles Analyst", "Learning Dynamics Analyst"]

[mcp_servers.agentify-desktop]
command = "node"
args = ['C:\Projects\agentify-desktop\bin\agentify-desktop.mjs', "mcp"]
tool_timeout_sec = 2700

# BEGIN HMASD CODEX SEMANTIC MVP
[mcp_servers.hmasd_orchestrator]
command = "C:\\Users\\fires\\.conda\\envs\\hmasd-amd-cpu\\python.exe"
args = [
  "-m",
  "tools.codex_semantic_mvp.mcp_server",
  "--state-dir",
  "runtime/codex-semantic-mvp"
]
startup_timeout_sec = 15
tool_timeout_sec = 1800
