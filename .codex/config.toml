#:schema https://developers.openai.com/codex/config-schema.json

# New chats use the model and reasoning effort selected in the Codex app.
# Root role preference remains Sol/low; select it per task.
# Individual named agent configurations retain their own defaults.
# Main sessions can be Root or direct DM; the role choice does not load a child model/config.
# Root entry: .agents/skills/hmasd-loop-dispatch/SKILL.md.
# Direct DM entry: read agents/hmasd-direction-manager.toml's instruction body via AGENTS.md.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = false

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 1500000
default_wait_timeout_ms = 1500000
max_wait_timeout_ms = 3600000

[agents]
# Three is the research-runtime resource ceiling, independent DMs and children combined.
# It does not limit the full plan's questions or create permanent DM-to-direction assignments.
# This runtime fan-out also accommodates bounded implementers and independent reviewers.
max_concurrent_threads_per_session = 40
interrupt_message = true

[agents.HMASDDirectionManager]
description = "Scientific question owner under the constitution: continuity across approaches, ideas, code, runs and three records."
config_file = "./agents/hmasd-direction-manager.toml"

[agents.HMASDImplementer]
description = "DM-owned 6-Sol/high implementer for one bounded code task from an L0 note."
config_file = "./agents/hmasd-implementer.toml"

[agents.HMASDScout]
description = "Optional read-only engineering/evidence mapping or primary-source simple-model bridge."
config_file = "./agents/hmasd-scout.toml"

[agents.HMASDReviewer]
description = "Independent Astra/high review for high-risk changes; evidence returns to the assigning owner."
config_file = "./agents/hmasd-reviewer.toml"

[agents.HMASDVerifier]
description = "Optional focused runtime-observation method."
config_file = "./agents/hmasd-verifier.toml"

[agents.HMASDExperimentOperator]
description = "Optional executor for a bounded launch and collection batch."
config_file = "./agents/hmasd-experiment-operator.toml"

[agents.HMASDResearchCritic]
description = "Optional independent criticism of claims, belief updates and discriminating predictions."
config_file = "./agents/hmasd-research-critic.toml"

# The agentify MCP server is registered per host in the user-level configuration of each
# runtime (~/.codex/config.toml, `claude mcp add --scope user`), not here. Its command is
# host-specific (`node` on Windows; the Windows node.exe over WSL interop on the WSL host),
# Codex has no per-OS form for a project entry, and a project entry was the only reason a
# per-host branch of this file existed. Keep `tool_timeout_sec = 2700` in the user-level
# entry: a Pro answer can take that long.
