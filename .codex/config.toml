[mcp_servers.hmasd_observability]
command = "C:\\Users\\fires\\.conda\\envs\\hmasd-amd-cpu\\python.exe"
args = [
  "-m",
  "tools.hmasd_control_plane.mcp_server",
  "--repo-root",
  "C:\\Projects\\HMASD"
]
startup_timeout_sec = 15
tool_timeout_sec = 120
