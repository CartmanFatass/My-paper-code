#:schema https://developers.openai.com/codex/config-schema.json

# Sol uses the v2 multi-agent runtime. Keep one explicit feature flag so the
# project configuration matches the live runtime.

[features]
multi_agent_v2 = true

[agents]
max_threads = 8
max_depth = 1
interrupt_message = true

[agents."HMASDCodeScout"]
description = "Read-only HMASD code scout for bounded interface mapping and safe parallel-work discovery."
config_file = "./agents/hmasd-code-scout.toml"
nickname_candidates = ["HMASD Scout", "Interface Scout", "Dependency Scout"]

[agents."HMASDImplementer"]
description = "HMASD implementation worker for one frozen bounded work package."
config_file = "./agents/hmasd-implementer.toml"
nickname_candidates = ["HMASD Implementer", "Algorithm Implementer", "Runtime Implementer"]

[agents."HMASDVerifier"]
description = "HMASD focused CUDA and runtime verifier for an integrated package."
config_file = "./agents/hmasd-verifier.toml"
nickname_candidates = ["HMASD Verifier", "CUDA Verifier", "Evidence Verifier"]

[agents."HMASDReviewer"]
description = "Read-only HMASD reviewer for an integrated implementation package."
config_file = "./agents/hmasd-reviewer.toml"
nickname_candidates = ["HMASD Reviewer", "Algorithm Reviewer", "Runtime Reviewer"]
