#:schema https://developers.openai.com/codex/config-schema.json

# Every local task created in this trusted HMASD project starts with Full Access.
# Keep these explicit here so the project Transport singleton and research tasks do
# not inherit the desktop client's Workspace/on-request defaults.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
multi_agent_v2 = true
hooks = false

[agents]
# Research capacity is repository-unbounded under AGENTS.md section 5. This knob limits only the
# runtime's thread fan-out; DM -> CM is the default chain, with specialist children as needed.
max_concurrent_threads_per_session = 40
interrupt_message = true

[agents.HMASDDirectionManager]
description = "Fixed loop driver for one research direction (card, intake, delegated decisions, Pro escalation)."
config_file = "./agents/hmasd-direction-manager.toml"

[agents.HMASDCM]
description = "Fixed native engineering and implementation subagent."
config_file = "./agents/hmasd-cm.toml"

[agents.HMASDCMScout]
description = "Optional engineering-surface mapping method."
config_file = "./agents/hmasd-cm-scout.toml"

[agents.HMASDReviewer]
description = "Optional engineering-analysis method."
config_file = "./agents/hmasd-reviewer.toml"

[agents.HMASDVerifier]
description = "Optional focused runtime-observation method."
config_file = "./agents/hmasd-verifier.toml"

[agents.HMASDExperimentOperator]
description = "Optional operator for one exact result-bearing command."
config_file = "./agents/hmasd-experiment-operator.toml"

[agents.HMASDResearchCritic]
description = "Optional independent scientific-criticism method."
config_file = "./agents/hmasd-research-critic.toml"

[agents.HMASDImplementer]
description = "Optional semantic implementation method."
config_file = "./agents/hmasd-implementer.toml"

[agents.HMASDRoutineImplementer]
description = "Optional routine implementation method."
config_file = "./agents/hmasd-routine-implementer.toml"

[mcp_servers.agentify-desktop]
command = "node"
args = ['C:\Projects\agentify-desktop\bin\agentify-desktop.mjs', "mcp"]
tool_timeout_sec = 2700
