#:schema https://developers.openai.com/codex/config-schema.json

[features]
multi_agent = true
multi_agent_v2 = false

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800

[agents."codebase-scout"]
description = "Read-only HMASD codebase scout for focused mapping and evidence gathering."
config_file = "./agents/codebase-scout.toml"
nickname_candidates = ["Scout", "Mapper", "Context Scout"]

[agents."simple-patcher"]
description = "Small scoped patch worker for trivial mechanical edits."
config_file = "./agents/simple-patcher.toml"
nickname_candidates = ["Patcher", "Fixer", "Small Patch Worker"]

[agents."SparkImplementer"]
description = "Cost-controlled implementation worker for non-core mechanical tasks from accepted plans."
config_file = "./agents/spark-implementer.toml"
nickname_candidates = ["SparkImplementer", "Spark Worker", "Mechanical Implementer", "Low-Cost Implementer"]

[agents."PlanImplementer"]
description = "High-tier implementation worker for core bounded code tasks from accepted plans."
config_file = "./agents/plan-implementer.toml"
nickname_candidates = ["PlanImplementer", "Plan Worker", "Implementation Worker", "SDD Implementer"]

[agents."PlanImplementerFrontier"]
description = "Frontier implementation worker for rare bounded core-code tasks that require architecture or algorithm judgment during implementation."
config_file = "./agents/plan-implementer-frontier.toml"
nickname_candidates = ["PlanImplementerFrontier", "AlgorithmImplementerXHigh", "Frontier Implementer", "XHigh Implementer"]

[agents."ImplementationReviewerFast"]
description = "Fast reviewer for small isolated mechanical diffs with explicit cheap model settings."
config_file = "./agents/implementation-reviewer-fast.toml"
nickname_candidates = ["ImplementationReviewerFast", "Fast Reviewer", "Cheap Reviewer", "Mechanical Review"]

[agents."ImplementationReviewer"]
description = "Standard reviewer for nontrivial task reviews with model-tiered cost control."
config_file = "./agents/implementation-reviewer.toml"
nickname_candidates = ["ImplementationReviewer", "Standard Reviewer", "Code Reviewer", "SDD Reviewer", "Quality Gate"]

[agents."ImplementationReviewerFrontier"]
description = "Most-capable reviewer for architecture, high-risk, shared-state, API/data-contract, and final whole-branch reviews."
config_file = "./agents/implementation-reviewer-frontier.toml"
nickname_candidates = ["ImplementationReviewerFrontier", "Frontier Reviewer", "Final Reviewer", "Architecture Reviewer"]

[agents."test-runner"]
description = "Focused test runner and failure triage worker."
config_file = "./agents/test-runner.toml"
nickname_candidates = ["Test Runner", "Verifier", "Failure Triage"]

[agents."ExpManager"]
description = "Experiment manager for scripts, packages, launch commands, progress checks, logs, metrics, and factual records."
config_file = "./agents/exp-manager.toml"
nickname_candidates = ["ExpManager", "Exp Manager", "Remote Bundle Manager", "Experiment Steward"]

[agents."ResultAnalyst"]
description = "Bounded experiment metric extraction and gate-table analyst for existing run artifacts."
config_file = "./agents/result-analyst.toml"
nickname_candidates = ["ResultAnalyst", "Metric Analyst", "Gate Analyst", "Run Analyst"]

[agents."ExternalReviewManager"]
description = "External model review archive and handoff manager."
config_file = "./agents/external-review-manager.toml"
nickname_candidates = ["ExternalReviewManager", "CrossReviewManager", "ReviewExchangeManager", "External Review", "Cross Review", "Claude GPT Gemini Review"]

[agents."LongTimeMemoryManager"]
description = "Memory-only steward for compact current records, plan/principle sync, and LTM archives."
config_file = "./agents/long-time-memory-manager.toml"
nickname_candidates = ["LongTimeMemoryManager", "LTM Manager", "Memory Steward", "Project Memory Manager"]

[agents."WorkflowAuditor"]
description = "Read-only auditor for Codex subagent config, controller protocol, and workflow-document consistency."
config_file = "./agents/workflow-auditor.toml"
nickname_candidates = ["WorkflowAuditor", "Config Auditor", "Protocol Auditor", "Agent Auditor"]
