#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
multi_agent_v2 = true
hooks = false

[agents]
max_concurrent_threads_per_session = 8
interrupt_message = true

[agents.HMASDCMScout]
description = "Read-only map of an unfamiliar engineering surface."
config_file = "./agents/hmasd-cm-scout.toml"

[agents.HMASDReviewer]
description = "Independent high-impact CM-owned engineering reviewer."
config_file = "./agents/hmasd-reviewer.toml"

[agents.HMASDWorkflowDesigner]
description = "Designs one exact HMASD workflow/control-plane transaction."
config_file = "./agents/hmasd-workflow-designer.toml"

[agents.HMASDDesignReviewer]
description = "One-shot independent review of one exact HMASD workflow/control-plane design."
config_file = "./agents/hmasd-design-reviewer.toml"

[agents.HMASDVerifier]
description = "Exceptional focused runtime verifier."
config_file = "./agents/hmasd-verifier.toml"

[agents.HMASDExperimentOperator]
description = "Operator for one exact result-bearing command."
config_file = "./agents/hmasd-experiment-operator.toml"

[agents.HMASDResearchScout]
description = "Primary and multi-source research evidence scout."
config_file = "./agents/hmasd-research-scout.toml"

[agents.HMASDResearchCritic]
description = "Exceptional independent research critic."
config_file = "./agents/hmasd-research-critic.toml"

[agents.HMASDGeneralLeaf]
description = "General Luna-xhigh leaf for bounded non-mainline chores."
config_file = "./agents/hmasd-general-leaf.toml"

[agents.HMASDResearchInnovator]
description = "Independent mechanism and discriminator innovator for one EM-frozen question."
config_file = "./agents/hmasd-research-innovator.toml"

[agents.HMASDResearchPrinciplesAnalyst]
description = "Independent MARL principles audit for one EM-frozen scientific object."
config_file = "./agents/hmasd-research-principles-analyst.toml"

[agents.HMASDImplementer]
description = "Semantic implementation worker for one CM-frozen bounded change."
config_file = "./agents/hmasd-implementer.toml"

[agents.HMASDRoutineImplementer]
description = "Routine behavior-preserving implementation worker for one CM-frozen change."
config_file = "./agents/hmasd-routine-implementer.toml"

[mcp_servers.agentify-desktop]
command = "node"
args = ['C:\Projects\agentify-desktop\bin\agentify-desktop.mjs', "mcp"]
tool_timeout_sec = 2700
