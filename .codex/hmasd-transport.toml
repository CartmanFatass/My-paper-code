schema_version = 1
mode = "browser_procedure"
status = "active"
backend = "host_specific"
environment = "local"

# Native task identities are request-bound, never global endpoints.
[provider]
model = "GPT-6 Astra"
mode = "Pro"
label = "6 Pro"
selector_hint = "Latest"

# The author supplies the current conversation URL from NOTES.md or the Portfolio section.
# Tool keys belong to questions, not permanent direction bindings.
[conversation_policy]
mode = "serial_reuse"

# WSL host: Jev Ultrafast drives a local Chrome on the owner's second ChatGPT account.
# Conversation URLs of the Agentify account do not exist on this account; a question sent here
# starts from "new" or from a URL this account returned. Credentials stay in Jev's own .env.
[jev]
root = "~/test/Jev/jev-ultrafast"
chrome = "~/.omp/puppeteer/chrome/linux-150.0.7871.24/chrome-linux64/chrome"
profile = "~/.config/google-chrome-for-testing"
cdp_url = "http://127.0.0.1:9222"
provider_root = "https://chatgpt.com/"
default_mode = "headless"
effort_label = "6 Pro"
# Owner, 2026-09-27: 6 Pro and 5.6 Pro are both on this account with the GitHub connector. When the
# 6 Pro option is unavailable (quota banner, disabled entry, or a PreSendFailure naming the model
# menu), the same key is resent once with `--effort` set to this label; the question text does not
# change. The driver proves whatever label it is given the same way, so the first fallback use is a
# `--dry-run` that reads the actual picker; if the proof needs extending it is extended from that
# observation and tested, never guessed.
fallback_effort_label = "5.6 Pro"
# Owner, 2026-09-19: Jev answers connector permission prompts with "Always allow" for the
# connectors named here. Only GitHub is authorised, as needed for engineering collaboration;
# a prompt for any other connector is left for a human.
approval_policy = "always_allow"
approval_connectors = ["GitHub"]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
state_dir = "~/.local/state/hmasd-pro-transport"
# Optional page proxy for the driver's Chrome. When absent, the driver passes the shell's
# https_proxy/http_proxy explicitly (no_proxy becomes the bypass list): Chrome on the WSL host does not
# read those variables itself, and the mirrored-network TUN route black-holes direct traffic (2026-09-27).
# proxy_server = "http://127.0.0.1:7890"
# proxy_bypass = "localhost,127.*"
# The driver always starts Chrome with --password-store=basic: with a session bus plus gnome-keyring
# present an unpinned headless Chrome blocks on the keyring prompt. The login session must be created
# under this store (owner login in headed mode); see docs/Claude_docs/changes/2026-09-27-jev-chrome-proxy.md.
