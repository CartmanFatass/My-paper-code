schema_version = 1
status = "active"
routing_policy = "task_suitable_node"
# Fallback for a platform the table below does not name. `--node` and
# HMASD_CONTROL_PLANE_NODE take precedence over both.
control_plane_node = "local_windows"
default_result_node = "wsl_4070"
fallback_policy = "reconcile_existing_process_preserve_frozen_semantics_admit_destination"

# The same tracked file serves the Windows checkout and the native WSL checkout; the launcher
# selects the control-plane node from the platform it runs on. A remote node is never selected
# this way: a launch there names it with `--node`.
[control_plane_by_platform]
win32 = "local_windows"
linux = "local_linux"

[control_source]
remote = "origin"
ref = "refs/heads/main"

[nodes.local_windows]
role = "control_plane_and_optional_compute"
project_root = "C:/Projects/HMASD"
python = "C:/Users/fires/.conda/envs/hmasd-amd-cpu/python.exe"
task_supervisor = "powershell_start_process"
result_memory_floor_gib = 4

[nodes.local_linux]
role = "control_plane_and_optional_compute"
enabled = true
project_root = "/home/fires/hmasd-wsl"
python = "/home/fires/.venvs/hmasd-linux-cpu/bin/python"
control_plane_python = "/home/fires/.venvs/hmasd-linux-science-tools/bin/python"
# The native C++ geometry loader calls torch.utils.cpp_extension, which finds ninja on PATH
# rather than in sys.prefix; ninja is installed inside the scientific venv.
path_prefix = "/home/fires/.venvs/hmasd-linux-cpu/bin:/home/fires/.local/bin"
run_shell = "bash -lc"
task_supervisor = "posix_detached_child"
host_identity = "Jacob"
os = "Ubuntu 24.04 on WSL2"
accelerator = "cpu"
result_memory_floor_gib = 4
# A separate clone, never a worktree or shared index across the OS boundary, and never
# /mnt/c: both vendors document degraded I/O and broken file watching across that mount.
shares_checkout_with_local_windows = false

[nodes.wsl_4070]
role = "primary_result_and_heavy_compute"
enabled = true
transport = "ssh"
ssh_target = "hmasd-wsl-node"
host_identity = "LAPTOP-U9TDKC8A"
os = "Ubuntu 24.04 on WSL2"
repo_root = "/home/wu/projects/HMASD"
worktree_root = "/home/wu/hmasd-worktrees"
input_staging_root = "/home/wu/hmasd-inputs"
python = "/home/wu/.venvs/hmasd/bin/python"
network_shell = "zsh -lic"
run_shell = "bash -lc"
# PyTorch's native loader resolves ninja on PATH, not beside sys.executable.
path_prefix = "/home/wu/.venvs/hmasd/bin:/home/wu/.local/bin:/usr/lib/wsl/lib"
task_supervisor = "/usr/local/bin/agent-task"
gpu_probe = "/usr/lib/wsl/lib/nvidia-smi"
gpu = "NVIDIA GeForce RTX 4070 Laptop GPU"
gpu_memory_mib = 8188
environment_verified_at = "2026-09-04T13:41:49Z"
python_version = "3.10.21"
numpy_version = "1.26.3"
torch_version = "2.7.0+cu118"
cuda_runtime = "11.8"
artifact_transport = "scp"
frozen_input_transport = "scp_with_declared_sha256"
result_memory_floor_gib = 4
sparse_checkout = [
  ".codex",
  "docs/research",
  "configs",
  "hmasd",
  "ha_ctse_process",
  "envs",
  "environments",
  "experiments",
  "scripts",
  "tools",
  "tests",
  "manifold_hmasd",
]

[invariants]
credentials_in_repository = false
remote_receipt_admits_local = false
local_receipt_admits_remote = false
migrate_live_processes = false
allow_duplicate_launch = false
control_plane_moves_remote = false
