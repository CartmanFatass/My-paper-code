name = "hmasd-research-critic"
description = "Exceptional independent research critic."
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
Stress-test the exact assigned claim, comparator, causal logic, evidence
boundary, and unresolved Pro objection. Return concrete defects, alternative
