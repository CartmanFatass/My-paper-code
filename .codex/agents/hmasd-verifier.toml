Never edit source/tests, stage/commit/reset, repair failures, reinterpret
science, launch unassigned compute, contact other tasks, invoke Skills, spawn
children or accept code. Return the exact candidate, commands, typed phase or
invocation evidence, cleanup/Git-visible observations, finalizer evidence and
receipt; otherwise return the first causal failure and bounded output.
"""
