version: 1
scope: codex-project
description: "Project-local Codex subagent profiles for lightweight HMASD tasks."
defaults:
  requested_model_alias: gpt5.3-spark
  model: gpt-5.3-codex-spark
  model_reasoning_effort: low
  reasoning_effort: low
  service_tier: default
  approval_policy: on-request
agents:
  - name: codebase-scout
    agent_type: explorer
    model: gpt-5.3-codex-spark
    model_reasoning_effort: low
    reasoning_effort: low
    service_tier: default
    sandbox_mode: read-only
    nickname_candidates:
      - Scout
      - Mapper
      - Context Scout
    path: codebase-scout.md
    summary: "Read-only project reconnaissance and context summaries."
  - name: simple-patcher
    agent_type: worker
    model: gpt-5.3-codex-spark
    model_reasoning_effort: low
    reasoning_effort: low
    service_tier: default
    sandbox_mode: workspace-write
    nickname_candidates:
      - Patcher
      - Fixer
      - Small Patch Worker
    path: simple-patcher.md
    summary: "Small, scoped implementation edits that follow existing patterns."
  - name: test-runner
    agent_type: worker
    model: gpt-5.3-codex-spark
    model_reasoning_effort: low
    reasoning_effort: low
    service_tier: default
    sandbox_mode: workspace-write
    nickname_candidates:
      - Test Runner
      - Verifier
      - Failure Triage
    path: test-runner.md
    summary: "Run targeted tests, classify failures, and report concise evidence."
  - name: ExpManager
    id: exp-manager
    display_name: ExpManager
    agent_type: worker
    model: gpt-5.3-codex-spark
    model_reasoning_effort: medium
    reasoning_effort: medium
    service_tier: default
    sandbox_mode: workspace-write
    nickname_candidates:
      - ExpManager
      - Exp Manager
      - Remote Bundle Manager
      - Experiment Steward
    path: exp-manager.md
    summary: "Manage HA-CTSE experiment scripts, packages, commands, logs, and factual experiment handoffs."
  - name: ExternalReviewManager
    id: external-review-manager
    display_name: ExternalReviewManager
    agent_type: worker
    model: gpt-5.3-codex-spark
    requested_model_alias: gpt5.3-spark
    model_reasoning_effort: medium
    reasoning_effort: medium
    service_tier: default
    sandbox_mode: workspace-write
    nickname_candidates:
      - ExternalReviewManager
      - CrossReviewManager
      - ReviewExchangeManager
      - External Review
      - Cross Review
      - Claude GPT Gemini Review
    path: external-review-manager.md
    summary: "Manage copy-paste Claude/GPT-5.5 Pro/Gemini review rounds, inbox/archive files, and memory handoffs."
  - name: LongTimeMemoryManager
    id: long-time-memory-manager
    display_name: LongTimeMemoryManager
    agent_type: worker
    model: gpt-5.5
    requested_model_alias: gpt5.5
    model_reasoning_effort: xhigh
    reasoning_effort: xhigh
    service_tier: priority
    sandbox_mode: workspace-write
    nickname_candidates:
      - LongTimeMemoryManager
      - LTM Manager
      - Memory Steward
      - Project Memory Manager
    path: long-time-memory-manager.md
    summary: "Manage compact current work, plans, project-level memory decisions, and LTM archives."
