name: D7.S event-aligned audit

# Two entry points, deliberately separate.
#
#   benchmark  cheap. Runs the clone conformance check, which both proves the
#              instrument works on Linux and prints `continuation s/step`.
#              That number decides whether `audit` is viable at all, because a
#              GitHub-hosted job is KILLED at 6 hours and one topology cannot
#              be split any finer (the pooler refuses to split episodes within
#              a topology). Locally the rate is 0.0615 s/step -> ~2.0 h for
#              |Z|=3 and ~3.9 h for |Z|=8. A runner 2x slower puts |Z|=8 at
#              ~7.9 h, i.e. over the ceiling. Measure before launching.
#
#   audit      the real thing, one job per topology seed. Each shard writes its
#              own JSON; pooling happens afterwards with
#              scripts/pool_d7_s_event_aligned_shards.py, which asserts the
#              shard seed sets are disjoint and their union is a frozen set.
#
# ############################################################################
# MEASURED 2026-07-27, run 30245735762: ubuntu-latest is TIGHT, not excluded.
#
# The runner benchmarked at 0.0864 s/step against 0.0615 locally -- 1.405x
# slower. Per topology that is 3.12 h at legal-set 3, 4.18 h at 5, and 5.77 h at
# 8, against the 6 h hard kill. Only the legal-set-8 case is close, the legal set
# size is data-determined, and it is not known before launch.
#
# A shard that overruns is NOT a lost result. A topology cannot be split, but it
# can be re-run whole and pooled afterwards; `fail-fast: false` keeps every other
# shard's artifact. On a public repo the minutes are free, so the cost of a slow
# shard is wall clock alone. That is why this is worth running rather than
# projecting -- the timing question is answered by trying it.
#
# A self-hosted runner on a cloud VM removes the ceiling entirely and is the
# better vehicle if several shards come back near 6 h.
# ############################################################################
#
# Both are workflow_dispatch only. Nothing here runs on push -- a formal run
# starts because someone decided to start it.

# TRIGGERS. Tags are the working route, not a convenience.
#
# `workflow_dispatch` only works once this file is on the DEFAULT branch
# (`new-test`); GitHub returns "not found on the default branch" otherwise. This
# work is scoped to `untied-k` and must not touch another branch, so dispatch is
# kept for later but cannot be used today.
#
# A `push` trigger on a TAG runs from the tagged commit on whatever branch it
# lives on, and a tag is not a branch — so tagging respects the scope exactly.
# Tag to run:
#     git tag d7s-benchmark-<n> && git push origin d7s-benchmark-<n>
#     git tag d7s-audit-<n>     && git push origin d7s-audit-<n>
# Tagging is also the right ergonomics for a multi-hour formal run: you tag when
# you mean it, rather than having every push start one.
#     git tag d7s-workers-<n>   && git push origin d7s-workers-<n>
on:
  push:
    tags:
      - "d7s-benchmark-*"
      - "d7s-audit-*"
      - "d7s-workers-*"
      - "d7s-replay-*"
  workflow_dispatch:
    inputs:
      mode:
        description: "benchmark (measure s/step), workers (determinism proof), audit (formal sharded run) or replay (manifest replay probe)"
        type: choice
        options: [benchmark, workers, audit, replay]
        default: benchmark

jobs:
  benchmark:
    if: inputs.mode == 'benchmark' || startsWith(github.ref, 'refs/tags/d7s-benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements_d7s_audit.txt
      - name: Install dependencies
        # Deliberately NOT requirements_sb3.txt -- that is a cu118 CUDA lock
        # exported from a different machine, and the recorded runtime pin is
        # cpu-only. The audit imports torch and stable-baselines3 nowhere; both
        # are guarded try/except in scenario_base.py and never referenced.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_d7s_audit.txt
      - name: Conformance check and step-rate measurement
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        # `nproc` alone is not the core count here: GNU coreutils honours
        # OMP_NUM_THREADS, which this job pins to 1, so it reports 1 on any
        # runner. The `workers` job's log says `nproc=1` for exactly that
        # reason and must not be read as a one-core machine. `nproc --all`
        # ignores the variable, and it decides whether `--workers N` can buy
        # anything on this vehicle at all.
        run: |
          echo "nproc=$(nproc) nproc_all=$(nproc --all)" | tee conformance.txt
          python scripts/d7_s_clone_conformance_check.py \
            --topology-seed 20260726 \
            --search-budget-seconds 900 | tee -a conformance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: d7s-benchmark
          path: conformance.txt

  # Proves `--workers N` changes only the schedule, never the result. The pooled
  # path folds results back in ascending episode index rather than completion
  # order, so a difference here means a real determinism defect, not jitter.
  #
  # This belongs on a runner rather than the workstation: it is apparatus
  # verification, not a conclusion-bearing run, and the workstation is shared
  # with another line's formal training. The minutes are free on a public repo.
  #
  # PASSED 2026-07-27, run 30270540138, at commit 527ffd26 -- a descendant of the
  # 96c0d02d fingerprint rewrite, so the proof covers the recursive encoder and
  # not the code it replaced. Both arms' `d7_s_event_aligned.json` and
  # `stdout.json` are byte-identical, verified by independent SHA-256 rather than
  # by trusting this job's own comparison step:
  #   d7_s_event_aligned.json  2e454d54...d60f5b8b  (29197 bytes, both arms)
  #   stdout.json              791b6ad6...fba50154  (29290 bytes, both arms)
  # `audit` below now passes `--workers 4`; see the note there for why 4.
  workers:
    if: inputs.mode == 'workers' || startsWith(github.ref, 'refs/tags/d7s-workers')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements_d7s_audit.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_d7s_audit.txt
      - name: Both arms, same seeds, different worker counts
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          mkdir -p w1 w4
          ARGS="--smoke --dev --episodes-calibration 4 --episodes-audit 2"
          echo "nproc=$(nproc)"
          /usr/bin/time -f "arm1_seconds=%e" -o w1/time.txt \
            python scripts/audit_d7_s_event_aligned.py $ARGS --workers 1 --out w1 > w1/stdout.json
          /usr/bin/time -f "arm4_seconds=%e" -o w4/time.txt \
            python scripts/audit_d7_s_event_aligned.py $ARGS --workers 4 --out w4 > w4/stdout.json
          cat w1/time.txt w4/time.txt
      - name: Byte-identity comparison
        run: |
          status=0
          if cmp -s w1/stdout.json w4/stdout.json; then
            echo "STDOUT_JSON: BYTE_IDENTICAL"
          else
            echo "STDOUT_JSON: DIFFERS"; status=1
          fi
          ( cd w1 && sha256sum * | sed 's#  .*/#  #' ) > w1.sums
          ( cd w4 && sha256sum * | sed 's#  .*/#  #' ) > w4.sums
          # `time.txt` differs by construction -- it records wall clock.
          sed -i '/time.txt/d' w1.sums w4.sums
          if cmp -s w1.sums w4.sums; then
            echo "OUT_DIR: BYTE_IDENTICAL"
          else
            echo "OUT_DIR: DIFFERS"; diff w1.sums w4.sums || true; status=1
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d7s-workers-proof
          path: |
            w1/
            w4/
          retention-days: 90

  audit:
    if: inputs.mode == 'audit' || startsWith(github.ref, 'refs/tags/d7s-audit')
    runs-on: ubuntu-latest
    # 6 h (360 min) is the GitHub-hosted hard ceiling. Stopping at 355 means an
    # overrun is a clean failure with the log intact rather than an abrupt kill,
    # while still giving a slow shard every usable minute -- 350 would have
    # failed shards that the ceiling itself would have allowed.
    #
    # An overrun is RECOVERABLE, contrary to what this file said earlier: a
    # topology cannot be SPLIT, but it can be re-run whole and pooled afterwards,
    # because the pooler keys on the seed set rather than on run identity. With
    # `fail-fast: false` the surviving shards keep their artifacts, so the cost
    # of a slow shard is its wall clock, not the run.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # R4's frozen population (contract D7_S_R4_ABSOLUTE_FOCAL_MARGIN_COMPLETE,
        # ledger R4-003). NOT R3's 20260726-20260733: those eight are measured,
        # autopsied and used to motivate R4 itself, and R4 forbids pooling with
        # them. Topology is the top-level inferential unit, so reusing them with
        # new episode seeds would give fresh CONDITIONAL draws, not fresh draws
        # from P_T.
        seed: [20260734, 20260735, 20260736, 20260737, 20260738, 20260739, 20260740, 20260741]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements_d7s_audit.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_d7s_audit.txt
      - name: Run one topology shard
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        # stdout carries the full lossless result JSON, so it is redirected to a
        # file rather than left to flood the Actions log. Progress telemetry
        # goes to stderr and stays visible.
        #
        # `--workers 4` because the runner has 4 real cores -- measured
        # `nproc --all=4` (run 30280427538), NOT the `nproc=1` the logs show,
        # which is coreutils honouring the OMP_NUM_THREADS=1 pinned above. Four
        # single-threaded workers on four cores is exactly saturating, not
        # oversubscribed. The flag changes only the schedule: run 30270540138
        # proved both arms byte-identical at this code.
        #
        # `--population r4` is REQUIRED and is not decoration. Identity is
        # DECLARED, not inferred: without this flag a single-seed shard earns no
        # R4 contract/namespace fields, runs under the legacy R3 seed namespace,
        # and pools into an artifact self-labelled "NOT R4 conclusion-bearing"
        # that still prints a conclusion-bearing branch line. The flag also hard-
        # refuses any seed outside the frozen population, so a matrix typo is a
        # loud failure rather than a quiet one.
        run: |
          mkdir -p shard_out
          python scripts/audit_d7_s_event_aligned.py \
            --population r4 \
            --topology-seeds ${{ matrix.seed }} \
            --workers 4 \
            --out shard_out > shard_out/stdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d7s-shard-${{ matrix.seed }}
          path: shard_out/
          retention-days: 90

  # Ruling 2026-07-30 (20260730_d7_s_manifest_replay_gate_result), §8 item 8:
  # run the SAME COMMITTED development manifest on two independently provisioned
  # cloud jobs. Tag twice (d7s-replay-1, d7s-replay-2), download both artifacts,
  # compare with scripts/d7_s_manifest_replay_gate.py. The probe refuses any R4
  # topology; this produces apparatus evidence only, never a conclusion-bearing
  # artifact, and a PASS selects A1 without wiring the manifest anywhere.
  # Exact job text: docs/project/PROPOSED_WORKFLOW_JOB_MANIFEST_REPLAY.md.
  replay:
    if: inputs.mode == 'replay' || startsWith(github.ref, 'refs/tags/d7s-replay')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements_d7s_audit.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_d7s_audit.txt
      - name: Manifest replay probe over the full registered horizon
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/d7_s_manifest_replay_probe.py \
            --mode replay \
            --manifest-root manifests/d7s_dev \
            --episodes 1 \
            --out replay_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d7s-replay-${{ github.run_id }}
          path: replay_probe.json
          retention-days: 90
