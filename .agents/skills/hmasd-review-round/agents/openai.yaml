  default_prompt: "Use $hmasd-review-round and $browser:control-in-app-browser only as Research Operations Manager's restricted transport mode. Accept one full-hash Assignment identity with the exact 40-character stage commit only when its renderer block is verified in the main body or its same-turn Pasted_text attachment passes the byte-exact attachment validator; a filename, cleared composer or generation start is insufficient, and an unreadable attachment is IDENTITY_UNREADABLE rather than send failure. Initialize the operations-manager-brokered JSONL sentinel with the complete verified identity and assign one live hmasd-pro-response-monitor; the child never opens the browser or reads response text. A true UNPERSISTED_CLIENT_SEND requires both identity sources and any attributable response to be absent; only the complete reload-then-exact-URL-reopen absence predicate permits one byte-exact complete-payload Assignment replay. A strict stage-commit prefix is a rejected transport record and permits at most one same-conversation full-hash correction before any assistant response, without resubmitting the scientific question. One ResponseRetry remains limited to its complete eligibility predicate; uncertain persistence is ineligible and there is no third submission. Record client-send, main-body identity, attachment identity, generation-started and natural-completion facts independently. Never activate Answer now. Follow registered-conversation recovery, natural completion, provenance intake and exact raw archival, then resume the local operations loop without a completion relay. Do not interpret science."
