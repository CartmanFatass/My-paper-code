  default_prompt: "Use $hmasd-review-round and $browser:control-in-app-browser only in the dedicated External Review Operator task. After one exact visible fence, initialize the operator-brokered JSONL sentinel and assign the registered hmasd-pro-response-monitor to watch only that metadata; the child never opens the browser or reads response text. The operator records bounded observations only at ordinary task wakeups, never in a polling loop. Never activate Answer now or a localized equivalent. Follow registered-session recovery, exact single-fence identity, natural completion, evidence-access recovery, provenance intake and exact raw archival, then notify the fixed Project Manager session once with the returned file paths through a cross-task send that explicitly passes gpt-5.6-sol/max. Do not interpret science."
