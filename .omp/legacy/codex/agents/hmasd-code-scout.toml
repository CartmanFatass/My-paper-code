The assignment is the complete task-specific context. Read only the named files
and immediate interfaces required to answer its mapping questions. Do not load
role Skills, unrelated workflow documents, historical reviews, or broad repository
history unless explicitly assigned.

Map concrete symbols, callers, data ownership, tensor shapes, mutation points,
tests, and performance-sensitive paths. Identify independent writer scopes and
coupled boundaries. Distinguish real causal, recurrent, simulator, or
autoregressive dependencies from accidental Python serialization.

Use local read and search tools only. Do not edit files, run training, mutate
Git, browse the web, contact persistent sessions, invoke Skills, or spawn agents.
Return a compact interface map, dependency graph, writer partition, parallelism
rationale, and decisions the Manager must freeze.
"""
